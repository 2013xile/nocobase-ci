name: Check out fixed source snapshot
description: Validate a forwarded CI dispatch, check out its immutable commits, optionally merge the PR, and revoke the checkout token.

inputs:
  repository:
    description: The source repository under nocobase (nocobase3-pro, studio, nocobase3, or nocobase on its v3 branches).
    default: nocobase3-pro
  path:
    description: The directory the source is checked out into.
    default: pro
  app-id:
    description: GitHub App ID installed on the source repository.
    required: true
  private-key:
    description: GitHub App private key.
    required: true
  request-id:
    description: UUID identifying the originating source event.
    required: true
  event-name:
    description: Source event type.
    required: true
  head-sha:
    description: Immutable source head commit.
    required: true
  base-sha:
    description: Immutable source base commit or the zero SHA.
    required: true
  target-branch:
    description: Source target branch.
    required: true
  pr-number:
    description: Source pull request number or 0 for a push.
    required: true
  skip-label:
    description: Whether the source pull request has the release:skip label.
    required: true
  merge-pull-request:
    description: Create and check out a local merge commit from base_sha and head_sha.
    default: 'true'
  partial-history:
    description: Fetch only the history of head_sha and base_sha, without file contents, instead of every branch and tag.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate dispatch inputs
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        CHECKOUT_PATH: ${{ inputs.path }}
        REQUEST_ID: ${{ inputs.request-id }}
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SKIP_LABEL: ${{ inputs.skip-label }}
      run: node "$GITHUB_ACTION_PATH/../validate-inputs.mjs"

    - name: Create a read-only source token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: nocobase
        repositories: ${{ inputs.repository }}
        permission-contents: read
        skip-token-revoke: true

    - name: Check out the immutable source head
      uses: actions/checkout@v4
      with:
        repository: nocobase/${{ inputs.repository }}
        ref: ${{ inputs.head-sha }}
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false
        fetch-depth: ${{ inputs.partial-history == 'true' && 1 || 0 }}
        submodules: recursive
        path: ${{ inputs.path }}
        show-progress: false

    # A large repository, such as nocobase/nocobase with its unrelated v2 history, is cloned at the head alone, then
    # given the commits and trees behind head_sha and base_sha (no blobs), enough for a merge base and a changed-file
    # list.
    - name: Fetch the history of the fixed commits
      if: ${{ inputs.partial-history == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        commits=("$HEAD_SHA")
        if [ "$EVENT_NAME" = 'pull_request' ]; then commits+=("$BASE_SHA"); fi
        auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
          fetch --quiet --no-tags --filter=blob:none --unshallow origin "${commits[@]}"

    - name: Prepare the immutable source snapshot
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        MERGE_PULL_REQUEST: ${{ inputs.merge-pull-request }}
      run: node "$GITHUB_ACTION_PATH/../prepare-snapshot.mjs"

    - name: Revoke the source token
      if: ${{ always() && steps.app-token.outputs.token != '' }}
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        curl --fail-with-body --silent --show-error --location \
          --request DELETE \
          --header 'Accept: application/vnd.github+json' \
          --header "Authorization: Bearer $APP_TOKEN" \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/installation/token
