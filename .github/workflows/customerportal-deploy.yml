name: CustomerPortal deploy
run-name: customerportal-deploy:${{ inputs.ref }}

# A manual redeploy of the private nocobase/CustomerPortal to the production environment (https://customer.nocobase.com), for a branch at its current head: run it by hand with
#
#   gh workflow run customerportal-deploy.yml -R 2013xile/nocobase-ci -f ref=main
#
# With `-f deploy=false` it builds and uploads the client assets to the CDN only, pushing no image and deploying nothing, which tries out a change to the CDN upload without touching production.
#
# Nothing dispatches it. The deployment of every push to `main` is the `Deploy` job of customerportal-ci.yml, which nocobase-bot forwards as a check on the pushed commit; this workflow builds and deploys in exactly the same way (the composite action customerportal-deploy) and shares its concurrency group, so a manual redeploy and a forwarded one never run at the same time. It creates no check.
#
# This repository is public: nothing uploads CustomerPortal's source or server build, and nothing is cached. The client assets go to the CDN, where the deployed page loads them from anyway.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of nocobase/CustomerPortal to build and deploy.
        required: true
        default: main
        type: string
      deploy:
        description: Push the image and deploy it. Off, the run only builds and uploads the client assets to the CDN, to try them out.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A deployment in progress is never cancelled; the one waiting behind it is replaced by a newer one.
    concurrency:
      group: customerportal-deploy
      cancel-in-progress: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      # A read-only token for nocobase/CustomerPortal alone, revoked as soon as the source is checked out.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: CustomerPortal
          permission-contents: read
          skip-token-revoke: true

      # Resolves the ref once, so the checkout and the tag name the same commit even if the branch moves meanwhile.
      - name: Resolve the ref
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          commit=$(gh api "repos/nocobase/CustomerPortal/commits/${REF}" --jq .sha)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Check out CustomerPortal
        uses: actions/checkout@v4
        with:
          repository: nocobase/CustomerPortal
          ref: ${{ steps.resolve.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: customerportal
          persist-credentials: false
          show-progress: false

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      - name: Build and deploy
        uses: ./.github/nocobase3/customerportal-deploy
        with:
          sha: ${{ steps.resolve.outputs.commit }}
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          registry-username: ${{ secrets.ALI_DOCKER_USERNAME }}
          registry-password: ${{ secrets.ALI_DOCKER_PASSWORD }}
          ssh-key: ${{ secrets.CUSTOMERPORTAL_DEPLOY_SSH_KEY }}
          deploy-host: ${{ vars.CUSTOMERPORTAL_DEPLOY_HOST }}
          known-hosts: ${{ vars.CUSTOMERPORTAL_DEPLOY_KNOWN_HOSTS }}
          cdn-oss-access-key-id: ${{ secrets.CDN_ALI_OSS_ACCESS_KEY_ID }}
          cdn-oss-access-key-secret: ${{ secrets.CDN_ALI_OSS_ACCESS_KEY_SECRET }}
          cdn-oss-bucket: ${{ secrets.CDN_ALI_OSS_BUCKET }}
          cdn-oss-region: ${{ secrets.CDN_ALI_OSS_REGION }}
          deploy: ${{ inputs.deploy }}
