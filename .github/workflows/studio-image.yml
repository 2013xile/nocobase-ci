name: Studio image
run-name: studio-image:${{ inputs.ref }}${{ inputs.release && ' (release)' || '' }}

# Builds NocoBase Studio's production image from packages/apps/studio of the public nocobase/nocobase repository and
# pushes it to the internal registry, in one of two modes:
#
# - Internal (`release: false`, the default): any branch, tag or commit. The universal `nb-studio` and `nocobase-runner`
#   packages, which carry no Node.js, are built from the same commit into runners-dist/ and baked into
#   /app/runners/dist, so Studio serves the CLI and runner it was built with. Studio's and the runner's versions are
#   first stamped `<version>.dev.<UTC timestamp>` (`<version>-dev.<timestamp>` without a prerelease part), so runners
#   and CLIs see the build as newer and upgrade. Tagged `dev-<short sha>` and the moving `dev`.
# - Release (`release: true`): the commit a v3 release published, normally its `release-beta/<batch>` tag. Versions are
#   left as released and no runners-dist/ is built, so Studio answers npm with the versions it was built with. Tagged
#   with the `@nocobase/studio` version in packages/apps/studio/package.json at that ref and the moving `beta`, or
#   `latest` when the version has no prerelease part. nocobase/nocobase's v3-release-beta.yml dispatches this mode after it
#   publishes `@nocobase/studio` to npm.
#
# The internal server pulls the image with the compose file in nocobase/deploy (`docker/studio/`). Run it by hand:
#
#   gh workflow run studio-image.yml -R 2013xile/nocobase-ci -f ref=v3-develop
#   gh workflow run studio-image.yml -R 2013xile/nocobase-ci -f ref=release-beta/2026-10-10.1 -f release=true

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/nocobase to build.
        required: true
        default: v3-develop
        type: string
      release:
        description: Build a release image tagged with the Studio version, without baked runner packages.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: studio-image-${{ inputs.ref }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push the Studio image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # nocobase/nocobase is public, so the checkout needs no token.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase
          ref: ${{ inputs.ref }}
          persist-credentials: false
          show-progress: false

      # Internal: dev-<short sha> and dev. Release: the Studio version and beta, or latest for a stable version.
      - name: Name the tags
        id: tags
        env:
          REGISTRY: ${{ secrets.ALI_DOCKER_REGISTRY }}
          REF: ${{ inputs.ref }}
          RELEASE: ${{ inputs.release }}
        run: |
          image="${REGISTRY}/nocobase/studio"
          sha=$(git rev-parse --short=7 HEAD)
          if [ "$RELEASE" = "true" ]; then
            manifest=packages/apps/studio/package.json
            version=$(jq -r '.version // empty' "$manifest" 2>/dev/null || true)
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::$REF has no valid version in $manifest (found '${version}'), so a release image cannot be tagged."
              exit 1
            fi
            case "$version" in
              *-*) channel=beta ;;
              *) channel=latest ;;
            esac
            tags=$(printf '%s:%s\n%s:%s' "$image" "$version" "$image" "$channel")
          else
            tags=$(printf '%s:dev-%s\n%s:dev' "$image" "$sha" "$image")
          fi
          {
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      # Internal images only: give nb-studio (Studio's version) and nocobase-runner a dev version, so runners and CLIs
      # see the build as newer than the release it is based on and upgrade. 1.0.0-beta.51 becomes
      # 1.0.0-beta.51.dev.<UTC YYYYMMDDHHMMSS>, which sorts above it and below 1.0.0-beta.52; a version without a
      # prerelease part takes -dev.<timestamp>. The checkout is changed, never the repository.
      - name: Stamp dev versions
        id: stamp
        if: ${{ !inputs.release }}
        run: |
          stamp=$(date -u +%Y%m%d%H%M%S)
          stamped=
          for manifest in packages/apps/studio/package.json packages/app/agent-runner/package.json; do
            version=$(jq -r '.version // empty' "$manifest")
            if [ -z "$version" ]; then
              echo "::error::$manifest has no version to stamp."
              exit 1
            fi
            case "$version" in
              *-*) dev="${version}.dev.${stamp}" ;;
              *) dev="${version}-dev.${stamp}" ;;
            esac
            jq --arg version "$dev" '.version = $version' "$manifest" > "$manifest.stamped"
            mv "$manifest.stamped" "$manifest"
            stamped="${stamped}$(jq -r '.name' "$manifest")@${dev}"$'\n'
          done
          printf '%s' "$stamped"
          {
            echo "versions<<EOF"
            printf '%s' "$stamped"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the workspace packages Studio depends on
        run: pnpm --filter "@nocobase/studio^..." build

      # dist/ is built here, with this job's heap, and the image takes it prebuilt.
      - name: Build dist for linux-x64
        working-directory: packages/apps/studio
        env:
          NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD: '1'
        run: pnpm build --target linux-x64

      # Internal images only. The Dockerfile copies runners-dist/ into /app/runners/dist, laid out as
      # stable/<product>/...; a release image has none and Studio answers npm with the versions it was built with.
      - name: Build the universal nb-studio package
        if: ${{ !inputs.release }}
        working-directory: packages/apps/studio
        run: pnpm nocobase cli build --universal --out runners-dist

      - name: Build the universal nocobase-runner package
        if: ${{ !inputs.release }}
        working-directory: packages/apps/studio
        run: pnpm nocobase cli build --runner --universal --out runners-dist

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/apps/studio
          file: packages/apps/studio/Dockerfile
          platforms: linux/amd64
          build-args: DIST=prebuilt
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.tags.outputs.sha }}
          MODE: ${{ inputs.release && 'release, no runner packages' || 'internal, universal runner packages baked in' }}
          VERSIONS: ${{ steps.stamp.outputs.versions }}
        run: |
          {
            echo '### Studio image'
            echo
            echo "Built \`${REF}\` (\`${SHA}\`), ${MODE}."
            echo
            printf '%s\n' "$TAGS" | sed 's/^.*\//- `/; s/$/`/'
            if [ -n "$VERSIONS" ]; then
              echo
              echo 'Stamped versions:'
              echo
              printf '%s\n' "$VERSIONS" | sed '/^$/d; s/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
