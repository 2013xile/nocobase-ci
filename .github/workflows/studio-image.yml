name: Studio image
run-name: studio-image:${{ inputs.ref }}

# Builds NocoBase Studio's production image from the private nocobase/studio repository and pushes it to the internal
# registry as `studio:<branch>` (when `ref` is a branch) and `studio:<short sha>`. The internal server pulls it with
# the compose file in nocobase/deploy (`docker/studio/`). Run it by hand:
#
#   gh workflow run studio-image.yml -R 2013xile/nocobase-ci -f ref=main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/studio to build.
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: studio-image-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push the Studio image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: read

      # The framework is a public submodule; only Studio itself needs the token.
      - name: Check out Studio
        uses: actions/checkout@v4
        with:
          repository: nocobase/studio
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: true
          show-progress: false

      - name: Name the tags
        id: tags
        env:
          REGISTRY: ${{ secrets.ALI_DOCKER_REGISTRY }}
          REF: ${{ inputs.ref }}
        run: |
          image="${REGISTRY}/nocobase/studio"
          sha=$(git rev-parse --short=7 HEAD)
          {
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "${image}:${sha}"
            # A commit is tagged by its sha alone; a branch or tag also by its name.
            if [ "$(git rev-parse --short=7 "$REF" 2>/dev/null || true)" != "${REF::7}" ]; then
              echo "${image}:$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dist/ is built here, with this job's heap, and the image takes it prebuilt.
      - name: Build dist for linux-x64
        run: pnpm build --target linux-x64

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: DIST=prebuilt
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo '### Studio image'
            echo
            printf '%s\n' "$TAGS" | sed 's/^.*\//- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
