name: Studio image
run-name: studio-image:${{ inputs.ref }}:${{ inputs.edition || 'studio-ee' }}${{ inputs.dry_run && ' (validation)' || '' }}

# Builds NocoBase Studio EE's internal image from the private nocobase/studio repository, from any branch, tag or commit,
# and pushes it to the internal registry as one image for linux/amd64 and linux/arm64: each platform builds its own
# dist/ and image in parallel, and a last job tags both under one multi-platform manifest. Studio is the repository root
# and the framework is the public submodule vendor/nocobase3; nb-studio's brand package is packages/studio-cli. Studio's
# long-lived branches mirror nocobase/nocobase's: `dev` tracks `v3-develop` and `main` tracks `v3-main`. Studio's,
# nb-studio's (`@nocobase/studio-cli`) and the runner's (`@nocobase/agent-runner`, in the submodule) versions are first
# stamped `<version>.dev.<UTC timestamp>` (`<version>-dev.<timestamp>` without a prerelease part), so runners and CLIs
# see the build as newer and upgrade. Studio's own `pnpm build` then packs the universal `nb-studio` and
# `nocobase-runner` packages, which carry no Node.js, at those versions into dist/runners, which the prebuilt image
# carries, so Studio serves the CLI and runner it was built with. Tagged `dev-<short sha>`, plus the moving tag of the
# branch: `dev` when `ref` is `dev`, `main` when it is `main`. A build of any other ref moves neither.
#
# The private testing workspace package is part of the Studio source checkout. Require it before installing; never
# fall back to a separate private-source overlay or publish a normal image missing QA.
#
# This workflow publishes only studio-ee. Formal releases publish both editions through v3-studio-release.yml.
#
# The internal server pulls the image with the compose file in nocobase/deploy (`docker/studio/`).
#
# nocobase-bot dispatches it with `ref` set to the branch for every push to nocobase/studio's `dev` or `main`; a newer
# push to the same branch cancels the build in progress. Run it by hand for any other ref:
#
#   gh workflow run studio-image.yml -R 2013xile/nocobase-ci -f ref=dev

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/studio to build.
        required: true
        default: dev
        type: string
      dry_run:
        description: Build and smoke-test without publishing any image
        type: boolean
        default: false
      edition:
        description: Image to validate; publishing is restricted to studio-ee
        type: choice
        options: [studio-ee, studio]
        default: studio-ee

permissions:
  contents: read

concurrency:
  group: studio-image-${{ inputs.ref }}-${{ inputs.edition || 'studio-ee' }}-${{ inputs.dry_run }}
  cancel-in-progress: true

jobs:
  # Resolves the ref once, so both platforms build the same commit even if the branch moves during the run, and names
  # the tags and the dev version stamp both platforms share.
  prepare:
    name: Resolve the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      sha: ${{ steps.tags.outputs.sha }}
      tags: ${{ steps.tags.outputs.tags }}
      stamp: ${{ steps.tags.outputs.stamp }}
    steps:
      - name: Validate edition
        env:
          EDITION: ${{ inputs.edition || 'studio-ee' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EDITION" in
            studio-ee) ;;
            studio) test "$DRY_RUN" = true || { echo 'Ordinary images are validation-only here.' >&2; exit 1; } ;;
            *) exit 1 ;;
          esac
      # A read-only token for nocobase/studio alone, revoked as soon as the ref is resolved.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: read
          skip-token-revoke: true

      - name: Resolve the ref
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          commit=$(gh api "repos/nocobase/studio/commits/${REF}" --jq .sha)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      # dev-<short sha>, and the moving tag of a long-lived branch: dev for dev, main for main. Tag names only: an
      # output holding the registry, a secret, would be dropped on its way to the other jobs.
      - name: Name the tags
        id: tags
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
          REF: ${{ inputs.ref }}
        run: |
          sha=${COMMIT:0:7}
          tags="dev-${sha}"
          case "$REF" in
            dev | main) tags=$(printf '%s\n%s' "$tags" "$REF") ;;
          esac
          {
            echo "sha=${sha}"
            echo "stamp=$(date -u +%Y%m%d%H%M%S)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Each platform builds its own dist/ and pushes its image by digest, in parallel; `manifest` then tags both as one.
  # Both run on x64: `pnpm build --target linux-arm64` fetches the arm64 native binaries rather than compiling under
  # emulation, and QEMU only runs the arm64 image's last few RUN lines.
  image:
    name: Build the linux/${{ matrix.arch }} image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: linux-x64
          - arch: arm64
            target: linux-arm64
    outputs:
      # The same on both platforms: one commit, one stamp.
      version: ${{ steps.build_dist.outputs.version }}
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # A read-only token for nocobase/studio alone, revoked as soon as the source is checked out.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: read
          skip-token-revoke: true

      # The framework is the public submodule vendor/nocobase3; only Studio itself needs the token.
      - name: Check out Studio
        uses: actions/checkout@v4
        with:
          repository: nocobase/studio
          ref: ${{ needs.prepare.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: true
          show-progress: false

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      - name: Require the in-repository Quality package
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const app = JSON.parse(readFileSync('package.json', 'utf8'));
          const testing = JSON.parse(readFileSync('packages/app-plugin-quality/package.json', 'utf8'));
          if (app.dependencies?.['@nocobase/app-plugin-quality'] !== 'workspace:*' ||
              testing.name !== '@nocobase/app-plugin-quality' || testing.private !== true ||
              !app.scripts?.['build:image']) {
            throw new Error('Studio EE images require the edition build entry and the private in-repository Quality package.');
          }
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # build:image installs the frozen graph in an isolated checkout, stamps all served packages there,
      # selects EE and checks the final artifact. The outer checkout stays at the resolved source revision.
      # Keep temporary packages on the runner's workspace disk to avoid cross-device renames.
      - name: Build edition dist
        id: build_dist
        env:
          TMPDIR: ${{ runner.temp }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
          TARGET: ${{ matrix.target }}
          EDITION: ${{ inputs.edition || 'studio-ee' }}
        run: |
          pnpm build:image --edition "$EDITION" --target "$TARGET" \
            --source-ref "$COMMIT" --dev-stamp "$STAMP" --out "$RUNNER_TEMP/studio-image"
          echo "version=$(jq -r '.version' "$RUNNER_TEMP/studio-image/build-metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up QEMU
        if: ${{ matrix.arch != 'amd64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushed by digest alone; the tags go on the multi-platform manifest.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/studio-image
          file: ${{ runner.temp }}/studio-image/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            DIST=prebuilt
            EDITION=${{ inputs.edition || 'studio-ee' }}
            SOURCE_REVISION=${{ needs.prepare.outputs.commit }}
          tags: ${{ inputs.dry_run && format('studio-validation:{0}-{1}', inputs.edition, matrix.arch) || '' }}
          outputs: ${{ inputs.dry_run && 'type=docker' || format('type=image,name={0}/nocobase/studio-ee,push-by-digest=true,name-canonical=true,push=true', secrets.ALI_DOCKER_REGISTRY) }}
          provenance: false

      - name: Check out smoke tooling
        if: ${{ inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: ci-tools
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Smoke-test the image
        if: ${{ inputs.dry_run }}
        env:
          IMAGE: studio-validation:${{ inputs.edition }}-${{ matrix.arch }}
          EDITION: ${{ inputs.edition }}
        run: node ci-tools/.github/nocobase3/studio-image-smoke.mjs "$IMAGE" "$EDITION"

      - name: Export the digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: ${{ !inputs.dry_run }}
    name: Tag the multi-platform image
    needs: [prepare, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Sign in to the registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag and push the manifest
        env:
          REGISTRY: ${{ secrets.ALI_DOCKER_REGISTRY }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          image="${REGISTRY}/nocobase/studio-ee"
          args=()
          while IFS= read -r tag; do
            args+=(--tag "${image}:${tag}")
          done <<< "$TAGS"
          for digest in "$DIGESTS"/*; do
            args+=("${image}@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${image}:$(head -n 1 <<< "$TAGS")"

      - name: Summary
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          {
            echo '### Studio EE image'
            echo
            echo "Built \`${REF}\` (\`${SHA}\`) for linux/amd64 and linux/arm64, serving the nb-studio and runner packages its build packed."
            echo
            while IFS= read -r tag; do
              echo "- \`nocobase/studio-ee:${tag}\`"
            done <<< "$TAGS"
            echo
            echo "Version: \`${VERSION}\` (shared dev stamp for Studio, nb-studio and runner)."
          } >> "$GITHUB_STEP_SUMMARY"
