name: Studio image
run-name: studio-image:${{ inputs.ref }}

# Builds NocoBase Studio's production image from packages/apps/studio of the public nocobase/nocobase repository and
# pushes it to the internal registry as `studio:<branch>` (when `ref` is a branch) and `studio:<short sha>`. The image carries the `nb-studio` and
# `nocobase-runner` tarballs for every platform in /app/runners/dist, which Studio serves. The internal server pulls it with
# the compose file in nocobase/deploy (`docker/studio/`). Run it by hand:
#
#   gh workflow run studio-image.yml -R 2013xile/nocobase-ci -f ref=v3-develop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/nocobase to build.
        required: true
        default: v3-develop
        type: string

permissions:
  contents: read

concurrency:
  group: studio-image-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push the Studio image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # nocobase/nocobase is public, so the checkout needs no token.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase
          ref: ${{ inputs.ref }}
          persist-credentials: false
          show-progress: false

      - name: Name the tags
        id: tags
        env:
          REGISTRY: ${{ secrets.ALI_DOCKER_REGISTRY }}
          REF: ${{ inputs.ref }}
        run: |
          image="${REGISTRY}/nocobase/studio"
          sha=$(git rev-parse --short=7 HEAD)
          {
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "${image}:${sha}"
            # A commit is tagged by its sha alone; a branch or tag also by its name.
            if [ "$(git rev-parse --short=7 "$REF" 2>/dev/null || true)" != "${REF::7}" ]; then
              echo "${image}:$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      - name: Build the workspace packages Studio depends on
        run: pnpm --filter "@nocobase/studio^..." build

      # dist/ is built here, with this job's heap, and the image takes it prebuilt.
      - name: Build dist for linux-x64
        working-directory: packages/apps/studio
        env:
          NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD: '1'
        run: pnpm build --target linux-x64

      # The Dockerfile copies runners-dist/ into /app/runners/dist, laid out as stable/<product>/... .
      - name: Build the nb-studio tarballs
        working-directory: packages/apps/studio
        run: pnpm nocobase cli build --out runners-dist

      - name: Build the nocobase-runner tarballs
        working-directory: packages/apps/studio
        run: pnpm nocobase cli build --runner --out runners-dist

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/apps/studio
          file: packages/apps/studio/Dockerfile
          platforms: linux/amd64
          build-args: DIST=prebuilt
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo '### Studio image'
            echo
            printf '%s\n' "$TAGS" | sed 's/^.*\//- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
