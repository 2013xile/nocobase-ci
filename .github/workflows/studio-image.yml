name: Studio image
run-name: studio-image:${{ inputs.ref }}

# Builds NocoBase Studio's internal image from the private nocobase/studio repository, from any branch, tag or commit,
# and pushes it to the internal registry. Studio is the repository root and the framework is the public submodule
# vendor/nocobase3 (nocobase/nocobase on v3-develop); nb-studio's brand package is packages/studio-cli. Studio's,
# nb-studio's (`@nocobase/studio-cli`) and the runner's (`@nocobase/agent-runner`, in the submodule) versions are first
# stamped `<version>.dev.<UTC timestamp>` (`<version>-dev.<timestamp>` without a prerelease part), so runners and CLIs
# see the build as newer and upgrade. Studio's own `pnpm build` then packs the universal `nb-studio` and
# `nocobase-runner` packages, which carry no Node.js, at those versions into dist/runners, which the prebuilt image
# carries, so Studio serves the CLI and runner it was built with. Tagged `dev-<short sha>`, and `dev` as well when `ref`
# is `main`; a build of any other ref never moves `dev`.
#
# Studio is no longer released to public registries: this internal image is the only one.
#
# The internal server pulls the image with the compose file in nocobase/deploy (`docker/studio/`).
#
# nocobase-bot dispatches it with `ref=main` for every push to nocobase/studio's main; a newer push cancels the build in
# progress. Run it by hand for any other ref:
#
#   gh workflow run studio-image.yml -R 2013xile/nocobase-ci -f ref=main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/studio to build.
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: studio-image-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push the Studio image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      # A read-only token for nocobase/studio alone, revoked as soon as the source is checked out.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: studio
          permission-contents: read
          skip-token-revoke: true

      # The framework is the public submodule vendor/nocobase3; only Studio itself needs the token.
      - name: Check out Studio
        uses: actions/checkout@v4
        with:
          repository: nocobase/studio
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: true
          show-progress: false

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      # dev-<short sha>, and the moving tag dev for main only.
      - name: Name the tags
        id: tags
        env:
          REGISTRY: ${{ secrets.ALI_DOCKER_REGISTRY }}
          REF: ${{ inputs.ref }}
        run: |
          image="${REGISTRY}/nocobase/studio"
          sha=$(git rev-parse --short=7 HEAD)
          tags=$(printf '%s:dev-%s' "$image" "$sha")
          if [ "$REF" = main ]; then
            tags=$(printf '%s\n%s:dev' "$tags" "$image")
          fi
          {
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Internal images only: give Studio, nb-studio (@nocobase/studio-cli's version) and nocobase-runner a dev
      # version, so runners and CLIs see the build as newer than the release it is based on and upgrade. Before
      # `pnpm build`, which records these versions and packs nb-studio and the runner at them. 1.0.0-beta.51 becomes
      # 1.0.0-beta.51.dev.<UTC YYYYMMDDHHMMSS>, which sorts above it and below 1.0.0-beta.52; a version without a
      # prerelease part takes -dev.<timestamp>. The checkout is changed, never the repository.
      - name: Stamp dev versions
        id: stamp
        run: |
          stamp=$(date -u +%Y%m%d%H%M%S)
          stamped=
          for manifest in package.json packages/studio-cli/package.json vendor/nocobase3/packages/app/agent-runner/package.json; do
            version=$(jq -r '.version // empty' "$manifest")
            if [ -z "$version" ]; then
              echo "::error::$manifest has no version to stamp."
              exit 1
            fi
            case "$version" in
              *-*) dev="${version}.dev.${stamp}" ;;
              *) dev="${version}-dev.${stamp}" ;;
            esac
            jq --arg version "$dev" '.version = $version' "$manifest" > "$manifest.stamped"
            mv "$manifest.stamped" "$manifest"
            stamped="${stamped}$(jq -r '.name' "$manifest")@${dev}"$'\n'
          done
          printf '%s' "$stamped"
          {
            echo "versions<<EOF"
            printf '%s' "$stamped"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # dist/ is built here, with this job's heap, and the image takes it prebuilt. Studio's build first builds the
      # workspace packages it depends on, and dist/ includes dist/runners, the nb-studio and nocobase-runner packages
      # Studio serves.
      - name: Build dist for linux-x64
        run: pnpm build --target linux-x64

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: DIST=prebuilt
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.tags.outputs.sha }}
          VERSIONS: ${{ steps.stamp.outputs.versions }}
        run: |
          {
            echo '### Studio image'
            echo
            echo "Built \`${REF}\` (\`${SHA}\`), serving the nb-studio and runner packages its build packed."
            echo
            printf '%s\n' "$TAGS" | sed 's/^.*\//- `/; s/$/`/'
            if [ -n "$VERSIONS" ]; then
              echo
              echo 'Stamped versions:'
              echo
              printf '%s\n' "$VERSIONS" | sed '/^$/d; s/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
