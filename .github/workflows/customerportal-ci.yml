name: CustomerPortal CI
run-name: customerportal-ci:${{ inputs.request_id }}

# The checks of the private nocobase/CustomerPortal repository that need this repository's secrets, dispatched by
# nocobase-bot (docs/ci-forwarding.md there), which mirrors each job below as a check run of the same name on
# nocobase/CustomerPortal. The job names are that protocol, and which job runs depends on the event, as in studio-ci.yml:
#
# - pull requests: `Preview` and `Test`. The bot forwards every pull request from a branch of the repository itself,
#   whatever its target, never a fork's: the preview runs the pull request's code next to the Studio key.
# - pushes to `main`: `Deploy`, which builds the pushed commit into an image and deploys it to the production environment (https://customer.nocobase.com).
#   The bot forwards no other branch and no push whose head commit says `[skip ci]`.
#
# CustomerPortal is a NocoBase 3 application at the repository root. `Preview` deploys the pull request's head to its
# own App `customerportal-pr-<n>` in Studio's `preview` environment, as the workflow Studio generated in the repository
# did (`nb-studio-customerportal-preview.yml`), which this replaces.
#
# This repository is public: nothing uploads CustomerPortal's source or its application build, and nothing is cached.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the no-preview label (true or false).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: customerportal-ci-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # Studio's standard preview workflow, adapted to a run that is neither in nocobase/CustomerPortal nor started by its
  # pull_request event: every command names the repository and the commit itself, and the logs are this run's. The key
  # is the CI key Studio keeps for nocobase/CustomerPortal, which may name only that repository, given only to the steps
  # that call Studio, through NB_STUDIO_API_KEY rather than a stored login.
  preview:
    name: Preview
    if: ${{ inputs.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NB_STUDIO_SERVER: ${{ vars.NB_STUDIO_URL }}
      REPOSITORY: nocobase/CustomerPortal
      HEAD_SHA: ${{ inputs.head_sha }}
      APP_ID: customerportal-pr-${{ inputs.pr_number }}
      ENVIRONMENT: preview
      LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      # The pull request's head itself, not a merge: Studio verifies the commit it deploys is the pull request's head.
      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: CustomerPortal
          path: customerportal
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      # A pull request that carries the `no-preview` label, or changes nothing the application runs (only documentation,
      # tests, e2e or CI files), gets no preview: the job ends here and Studio is told nothing. The bot passes the label as
      # skip_label; the labels are read again in case it changed since.
      - name: Read the pull request's labels
        id: pr-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: CustomerPortal
          permission-pull-requests: read

      - name: Decide whether to preview
        id: gate
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          SKIP_LABEL: ${{ inputs.skip_label }}
        run: |
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Preview skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview skipped: $1"
          }
          if [ "$SKIP_LABEL" = 'true' ] || gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx 'no-preview'; then
            skip "The pull request has the \`no-preview\` label."
            exit 0
          fi
          base=$(git -C customerportal merge-base "$BASE_SHA" "$HEAD_SHA")
          runtime=$(git -C customerportal diff --name-only "$base" "$HEAD_SHA" | grep -viE '^(docs/|tests/|e2e/|\.github/)|\.md$' || true)
          if [ -z "$runtime" ]; then
            skip 'It changes only documentation, tests, e2e or CI files.'
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: customerportal/package.json
          run_install: false

      - name: Set up Node.js
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The CLI Studio serves carries no Node.js and runs on the one set up above (Node.js 24 or newer).
      - name: Install the nb-studio CLI
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.CUSTOMERPORTAL_NB_STUDIO_API_KEY }}
        run: |
          eval "$(curl -fsS -H "x-api-key: $NB_STUDIO_API_KEY" "$NB_STUDIO_SERVER/api/agents/dist/products/nb-studio/targets/linux-x64?format=env")"
          mkdir -p "$RUNNER_TEMP/nb-studio"
          curl -fsS -H "x-api-key: $NB_STUDIO_API_KEY" "$NB_STUDIO_SERVER$url" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/nb-studio"
          echo "$RUNNER_TEMP/nb-studio/bin" >> "$GITHUB_PATH"
          # A command the CLI derives from the server's manifest (app ensure, deploy) fetches that manifest with the
          # stored sign-in, not with NB_STUDIO_API_KEY, so the CLI signs in with the key as Studio's generated workflow does.
          printf %s "$NB_STUDIO_API_KEY" | NB_STUDIO_KEYCHAIN=off "$RUNNER_TEMP/nb-studio/bin/nb-studio" login --server "$NB_STUDIO_SERVER" --api-key-stdin

      - name: Report the build
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.CUSTOMERPORTAL_NB_STUDIO_API_KEY }}
        run: nb-studio build status --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --state building --logs "$LOGS"

      # The pnpm version is the repository's own `packageManager`.
      - name: Install dependencies
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: customerportal
        run: pnpm install --frozen-lockfile

      # Leaves storage/exports/dist.tar.gz: dist/ and config.example.yml.
      - name: Build the deployment archive
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: customerportal
        run: pnpm build --target linux-x64 --tar

      # The pull request's own App: Studio records the pull request as its source and removes it once it goes.
      - name: Ensure the pull request's App
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.CUSTOMERPORTAL_NB_STUDIO_API_KEY }}
        run: nb-studio app ensure "$APP_ID" --environment "$ENVIRONMENT" --repository "$REPOSITORY"

      # Uploads the archive and deploys it; a protected environment asks its approvers instead.
      - name: Deploy
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.CUSTOMERPORTAL_NB_STUDIO_API_KEY }}
        run: nb-studio deploy --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --file customerportal/storage/exports/dist.tar.gz

      - name: Report the failure
        if: ${{ failure() && steps.gate.outputs.skip == 'false' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.CUSTOMERPORTAL_NB_STUDIO_API_KEY }}
        run: nb-studio build status --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --state failed --logs "$LOGS"

  # The application's Vitest suite (`pnpm test`) on the pull request merged into its base: the server and client tests
  # start the whole application on SQLite test databases, so the jobs need no database and no secret beyond the
  # checkout. The suite runs one file at a time, as the application's config says, in Vitest shards that divide the
  # test files: the front end (the `client` project, about 13 minutes in all) in three and the back end (the `node`
  # project: server, database, project and CLI tests, about 60 minutes, most of it starting an application per file)
  # in twelve, so each job takes about five minutes. Running files side by side in one job is not safe yet: the
  # applications' start-up scans saturate the runner's CPUs and time tests out, and carbone shares one temporary
  # directory. `Test` summarizes the jobs and is the check nocobase-bot mirrors (each part shows it in progress). The
  # `no-preview` label does not skip them.
  test-shard:
    name: Test (${{ matrix.name }})
    if: ${{ inputs.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: frontend 1/3, project: client, shard: 1/3 }
          - { name: frontend 2/3, project: client, shard: 2/3 }
          - { name: frontend 3/3, project: client, shard: 3/3 }
          - { name: backend 1/12, project: node, shard: 1/12 }
          - { name: backend 2/12, project: node, shard: 2/12 }
          - { name: backend 3/12, project: node, shard: 3/12 }
          - { name: backend 4/12, project: node, shard: 4/12 }
          - { name: backend 5/12, project: node, shard: 5/12 }
          - { name: backend 6/12, project: node, shard: 6/12 }
          - { name: backend 7/12, project: node, shard: 7/12 }
          - { name: backend 8/12, project: node, shard: 8/12 }
          - { name: backend 9/12, project: node, shard: 9/12 }
          - { name: backend 10/12, project: node, shard: 10/12 }
          - { name: backend 11/12, project: node, shard: 11/12 }
          - { name: backend 12/12, project: node, shard: 12/12 }
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          repository: CustomerPortal
          path: customerportal
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: customerportal/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: customerportal
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: customerportal
        run: pnpm test --project ${{ matrix.project }} --shard=${{ matrix.shard }}

  test:
    name: Test
    needs: test-shard
    if: ${{ always() && needs.test-shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every test shard
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "One or more test shards concluded with $RESULT."
            exit 1
          fi

  # Builds exactly `head_sha`, the commit the check is on, never the branch as it is now, so a newer push cannot make this
  # check deploy code it is not about. The job's concurrency group is shared with customerportal-deploy.yml (the manual
  # redeploy) and never cancels: a deployment in progress is left to finish, and a deployment waiting behind it is
  # replaced by a newer one, so the server only ever goes forward and a replaced run's check ends cancelled. The whole
  # build and deploy is one job so that its conclusion is the check's: a failed build fails `Deploy` instead of leaving
  # it skipped. nocobase-bot does not cancel a push's run when a newer push arrives (`keepsPushRuns`), since that would
  # stop a deployment midway. The steps are the composite action customerportal-deploy, shared with the manual redeploy.
  deploy:
    name: Deploy
    if: ${{ inputs.event_name == 'push' && inputs.target_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: customerportal-deploy
      cancel-in-progress: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          repository: CustomerPortal
          path: customerportal
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Build and deploy
        uses: ./.github/nocobase3/customerportal-deploy
        with:
          sha: ${{ inputs.head_sha }}
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          registry-username: ${{ secrets.ALI_DOCKER_USERNAME }}
          registry-password: ${{ secrets.ALI_DOCKER_PASSWORD }}
          ssh-key: ${{ secrets.CUSTOMERPORTAL_DEPLOY_SSH_KEY }}
          deploy-host: ${{ vars.CUSTOMERPORTAL_DEPLOY_HOST }}
          known-hosts: ${{ vars.CUSTOMERPORTAL_DEPLOY_KNOWN_HOSTS }}
