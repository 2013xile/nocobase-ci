name: Website v3 docs
run-name: website-v3-docs:${{ inputs.request_id }}

# The documentation site in the private nocobase/website-v3 (`doc/`): a pull request and a push to `main` build it, and
# a push to `main` can publish it to the documentation CDN. Dispatched by nocobase-bot (docs/ci-forwarding.md there),
# which mirrors the job named `Docs build` as a check run of the same name on nocobase/website-v3. The job names are
# that protocol. Every request builds, whatever it changes: a push must always leave the documentation built, so
# nothing here selects by path, and `skip_label` (which `validate-inputs.mjs` requires) is ignored.
#
# `Docs build` checks out the commit and builds the site, then uploads `doc/dist` as the artifact `website-v3-docs`.
# It touches no OSS or CDN secret: its only one is the GitHub App key that `.github/nocobase3/checkout` uses to read the
# source, and the action revokes that token before any of the site's code runs.
#
# PUBLISHING IS OFF. `Docs publish` below is complete but skipped until the repository variable
# `WEBSITE_V3_DOCS_PUBLISH` is `true`, and only a push to `main` publishes. The bot reports `Docs build` alone for now;
# to publish, also add `Docs publish` to the push row of nocobase-bot's `website-v3` forwarding (see
# docs/ci-forwarding.md there) and the checks section of .github/nocobase3/README.md here. Until then a skipped or
# failing `Docs publish` appears on the run's Actions page and not on website-v3. It downloads the artifact, builds
# nothing and checks out no site code. The OSS and CDN secrets appear only in the `env` of its `Publish` step, which
# runs this repository's own `.github/nocobase3/docs-publish/deploy-cdn.mjs`.
#
# Publishing is atomic and reversible, as the v3 documentation's has always been: the build is uploaded to its own
# timestamp directory in the bucket, then the CDN's back-to-origin rules of every domain in `V3_DOCS_ALI_CDN_DOMAINS`
# are pointed at it, so a reader sees the whole old version or the whole new one.
#
# The build contract (set by website-v3): Node.js 24, `npm ci --prefix doc --ignore-scripts`, then `node doc/build.mjs`
# at the repository root, writing `doc/dist/` (English at its root, Simplified Chinese in `zh-CN/`, every page as
# `<path>/index.html`, plus `404.html`, `sitemap.xml`, `robots.txt` and `llms.txt`). `DOCS_SITE_ORIGIN` sets the site's
# origin and defaults to https://docs.nocobase.com, which is what CI wants.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the skip-docs label (true or false); not used.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-v3-docs-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      # The commit itself, not a merge of a pull request into its base. The token is revoked inside this action, before
      # any of the site's code runs.
      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          repository: website-v3
          path: website
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: website
        run: npm ci --prefix doc --ignore-scripts

      - name: Build the site
        working-directory: website
        run: node doc/build.mjs

      # Only that the files the CDN and crawlers depend on exist; what is in them is website-v3's own business.
      - name: Check the build
        working-directory: website
        run: |
          missing=0
          for file in doc/dist/index.html doc/dist/zh-CN/index.html doc/dist/404.html doc/dist/sitemap.xml; do
            if [ ! -s "$file" ]; then
              echo "::error::The build did not produce $file."
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: website-v3-docs
          path: website/doc/dist
          if-no-files-found: error
          retention-days: 7

  # Two publishes never overlap, since each rewrites the same CDN rules, and a publish is never cancelled midway: a
  # rule pointing at a directory another run's cleanup deleted would take the site down.
  publish:
    name: Docs publish
    needs: build
    if: ${{ vars.WEBSITE_V3_DOCS_PUBLISH == 'true' && inputs.event_name == 'push' && inputs.target_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: website-v3-docs-publish
      cancel-in-progress: false
    steps:
      # Of two pushes that reach the CDN at once, only the newest may publish: a run whose commit is no longer the head
      # of `main` skips every step below, so an older build can never switch the rules back over a newer one.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: website-v3
          permission-contents: read
          skip-token-revoke: true

      - name: Compare with the head of the branch
        id: head
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ inputs.target_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          head=$(gh api "repos/nocobase/website-v3/commits/${BRANCH}" --jq .sha)
          if [ "$head" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${BRANCH} has moved on, so a newer push publishes instead of this one."
          fi

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      - name: Check out trusted CI helpers
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Download the site
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: website-v3-docs
          path: dist

      - name: Set up Node.js
        if: ${{ steps.head.outputs.current == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the publishing tools
        if: ${{ steps.head.outputs.current == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ossutil.zip" \
            https://gosspublic.alicdn.com/ossutil/v2/2.2.2/ossutil-2.2.2-linux-amd64.zip
          unzip -o -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          sudo mv "$RUNNER_TEMP/ossutil/ossutil-2.2.2-linux-amd64/ossutil" /usr/local/bin/ossutil
          sudo chmod 755 /usr/local/bin/ossutil
          npm ci --ignore-scripts --prefix .github/nocobase3/docs-publish

      - name: Publish
        if: ${{ steps.head.outputs.current == 'true' }}
        env:
          DOCS_ALI_OSS_ACCESS_KEY_ID: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_ID }}
          DOCS_ALI_OSS_ACCESS_KEY_SECRET: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_SECRET }}
          DOCS_ALI_OSS_BUCKET: ${{ secrets.V3_DOCS_ALI_OSS_BUCKET }}
          DOCS_ALI_OSS_REGION: ${{ secrets.V3_DOCS_ALI_OSS_REGION }}
          V3_DOCS_ALI_CDN_DOMAINS: ${{ vars.V3_DOCS_ALI_CDN_DOMAINS }}
          # ossutil reads the credentials from these names rather than the DOCS_-prefixed ones.
          OSS_ACCESS_KEY_ID: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.DOCS_ALI_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail

          for name in DOCS_ALI_OSS_ACCESS_KEY_ID DOCS_ALI_OSS_ACCESS_KEY_SECRET \
                      DOCS_ALI_OSS_BUCKET DOCS_ALI_OSS_REGION V3_DOCS_ALI_CDN_DOMAINS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Configure it before publishing."
              exit 1
            fi
          done

          # ossutil takes the bare region id, `cn-beijing`, and derives the endpoint from it; the SDK the publish
          # script uses takes the `oss-` prefixed form. The secret holds whichever one was pasted from the console,
          # and each side normalizes it — `--region oss-cn-beijing` is rejected outright.
          REGION="${DOCS_ALI_OSS_REGION#oss-}"

          # Asia/Shanghai so the directory name reads as the local time of the people who deploy it.
          TIMESTAMP="$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"
          echo "Uploading to oss://$DOCS_ALI_OSS_BUCKET/$TIMESTAMP/"

          ossutil cp -r dist/ "oss://$DOCS_ALI_OSS_BUCKET/$TIMESTAMP/" \
            -f -j 64 --region "$REGION"

          # The bucket's static-website error document is read from the root, not from inside a version directory.
          ossutil cp dist/404.html "oss://$DOCS_ALI_OSS_BUCKET/404.html" \
            -f --region "$REGION"

          node .github/nocobase3/docs-publish/deploy-cdn.mjs --timestamp "$TIMESTAMP"

          {
            echo "### Documentation published"
            echo
            echo "Version \`$TIMESTAMP\` is live on: ${V3_DOCS_ALI_CDN_DOMAINS}"
          } >> "$GITHUB_STEP_SUMMARY"
