name: Pro registry image
run-name: pro-registry-image:${{ inputs.ref }}

# A manual test and build of the image of pkg-v3.nocobase.com (NocoBase 3's private npm and Docker registry) from the private nocobase/v3-pro-registry at a `ref`, pushed to the internal registry as linux/amd64: `sha-<short sha>` always, plus the moving tag `main` when `ref` is `main`. A build of any other ref never moves `main`. It builds exactly as the forwarded CI does (the composite action image-push).
#
# Pull requests and pushes to `main` are tested, built and deployed by pro-registry-ci.yml, which nocobase-bot forwards with the checks `Test`, `Build` and `Deploy`; nothing dispatches this workflow any more. A build of `main` here is deployed too, by the `deploy` job, in the group `pro-registry-deploy` it shares with pro-registry-ci.yml. See "Image deployments over SSH" in .github/nocobase3/README.md. Run it by hand, with `-f deploy=false` to build `main` without deploying it; any other ref is never deployed:
#
#   gh workflow run pro-registry-image.yml -R 2013xile/nocobase-ci -f ref=main
#
# This repository is public: nothing uploads the source, and nothing is cached.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/v3-pro-registry to build.
        required: true
        default: main
        type: string
      deploy:
        description: Deploy the image to pkg-v3 once it is built; only a build of `main` is ever deployed.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  image:
    name: Test and build the linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer build of the same ref replaces this one; the deployment has its own group and is never cancelled.
    concurrency:
      group: pro-registry-image-${{ inputs.ref }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      # A read-only token for nocobase/v3-pro-registry alone, revoked as soon as the source is checked out.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: v3-pro-registry
          permission-contents: read
          skip-token-revoke: true

      # Resolves the ref once, so the checkout and the tag name the same commit even if the branch moves meanwhile.
      - name: Resolve the ref
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          commit=$(gh api "repos/nocobase/v3-pro-registry/commits/${REF}" --jq .sha)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "sha=${commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check out v3-pro-registry
        uses: actions/checkout@v4
        with:
          repository: nocobase/v3-pro-registry
          ref: ${{ steps.resolve.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: v3-pro-registry
          persist-credentials: false
          show-progress: false

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      # The pnpm of the repository's `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: v3-pro-registry/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: v3-pro-registry
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: v3-pro-registry
        run: pnpm typecheck

      - name: Test
        working-directory: v3-pro-registry
        run: pnpm test

      - name: Build and push the image
        uses: ./.github/nocobase3/image-push
        with:
          path: v3-pro-registry
          image: nocobase/pro-registry
          sha: ${{ steps.resolve.outputs.commit }}
          push-main: ${{ inputs.ref == 'main' }}
          build-args: NPM_REGISTRY=https://registry.npmjs.org/
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          registry-username: ${{ secrets.ALI_DOCKER_USERNAME }}
          registry-password: ${{ secrets.ALI_DOCKER_PASSWORD }}

  deploy:
    name: Deploy to pkg-v3
    needs: image
    if: ${{ inputs.ref == 'main' && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A deployment in progress is never cancelled; the one waiting behind it is replaced by a newer one.
    concurrency:
      group: pro-registry-deploy
      cancel-in-progress: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Deploy
        uses: ./.github/nocobase3/ssh-deploy
        with:
          name: pkg-v3
          tag: sha-${{ needs.image.outputs.sha }}
          ssh-key: ${{ secrets.PRO_REGISTRY_DEPLOY_SSH_KEY }}
          deploy-host: ${{ vars.PRO_REGISTRY_DEPLOY_HOST }}
          known-hosts: ${{ vars.PRO_REGISTRY_DEPLOY_KNOWN_HOSTS }}
          secret-names: PRO_REGISTRY_DEPLOY_SSH_KEY, PRO_REGISTRY_DEPLOY_HOST or PRO_REGISTRY_DEPLOY_KNOWN_HOSTS
