name: Bot CI
run-name: bot-ci:${{ inputs.request_id }}

# The checks of the private nocobase/nocobase-bot repository, dispatched by nocobase-bot itself (docs/ci-forwarding.md there), which mirrors each job below as a check run of the same name on the pushed commit. The job names are that protocol.
#
# - pushes to `main`: `Build`, the image `nocobase/nocobase-bot:sha-<short sha>` and `main` (the composite action image-push), and `Deploy`, that tag deployed to noco-bot over SSH (the composite action ssh-deploy, see "Image deployments over SSH" in .github/nocobase3/README.md).
# - pull requests are not forwarded.
#
# The bot restarts itself while `Deploy` runs: its forwarding state is in SQLite under the mounted data/, so the new process resumes polling this run and reports `Deploy` once it ends. A newer push never cancels this run (the bot's row keeps push runs), but its `Build` replaces this one's still in progress, and its `Deploy` waits for this one's: one deployment runs at a time, never stopped midway, sharing its group with bot-image.yml, the manual build.
#
# This repository is public: nothing uploads the source, and nothing is cached.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the skip label (true or false); unused.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ inputs.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push's build replaces this one; the deployment has its own group and is never cancelled.
    concurrency:
      group: bot-build
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase-bot
          path: nocobase-bot
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Build and push the image
        id: image
        uses: ./.github/nocobase3/image-push
        with:
          path: nocobase-bot
          image: nocobase/nocobase-bot
          sha: ${{ inputs.head_sha }}
          moving-tag: ${{ inputs.target_branch == 'main' && 'main' || '' }}
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          registry-username: ${{ secrets.ALI_DOCKER_USERNAME }}
          registry-password: ${{ secrets.ALI_DOCKER_PASSWORD }}

  deploy:
    name: Deploy
    needs: build
    if: ${{ inputs.event_name == 'push' && inputs.target_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A deployment in progress is never cancelled; the one waiting behind it is replaced by a newer one.
    concurrency:
      group: bot-deploy
      cancel-in-progress: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Deploy
        uses: ./.github/nocobase3/ssh-deploy
        with:
          name: nocobase-bot
          tag: ${{ needs.build.outputs.tag }}
          ssh-key: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
          deploy-host: ${{ vars.BOT_DEPLOY_HOST }}
          known-hosts: ${{ vars.BOT_DEPLOY_KNOWN_HOSTS }}
          secret-names: BOT_DEPLOY_SSH_KEY, BOT_DEPLOY_HOST or BOT_DEPLOY_KNOWN_HOSTS
