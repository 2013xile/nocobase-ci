name: Pro registry CI
run-name: pro-registry-ci:${{ inputs.request_id }}

# The checks of the private nocobase/v3-pro-registry repository (pkg-v3.nocobase.com), dispatched by nocobase-bot (docs/ci-forwarding.md there), which mirrors each job below as a check run of the same name on the source repository. The job names are that protocol.
#
# - pull requests: `Test`, `pnpm typecheck` and `pnpm test` on the pull request merged into its base. The bot forwards every pull request from a branch of the repository itself, never a fork's.
# - pushes to `main`: `Test` on the pushed commit, then `Build`, the image `nocobase/pro-registry:sha-<short sha>` and `main` (the composite action image-push), and `Deploy`, that tag deployed to noco-hk over SSH (the composite action ssh-deploy, see "Image deployments over SSH" in .github/nocobase3/README.md). The restart interrupts the registry for a few seconds.
#
# A newer push never cancels this run (the bot's row keeps push runs), but its `Build` replaces this one's still in progress, and its `Deploy` waits for this one's: one deployment runs at a time, never stopped midway, sharing its group with pro-registry-image.yml, the manual build.
#
# This repository is public: nothing uploads the source, and nothing is cached.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the skip label (true or false); unused.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pro-registry-ci-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          repository: v3-pro-registry
          path: v3-pro-registry
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      # The pnpm of the repository's `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: v3-pro-registry/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: v3-pro-registry
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: v3-pro-registry
        run: pnpm typecheck

      - name: Test
        working-directory: v3-pro-registry
        run: pnpm test

  build:
    name: Build
    needs: test
    if: ${{ inputs.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push's build replaces this one; the deployment has its own group and is never cancelled.
    concurrency:
      group: pro-registry-build
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          repository: v3-pro-registry
          path: v3-pro-registry
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      # The runner reaches the public npm registry directly rather than through the Dockerfile's default mirror.
      - name: Build and push the image
        id: image
        uses: ./.github/nocobase3/image-push
        with:
          path: v3-pro-registry
          image: nocobase/pro-registry
          sha: ${{ inputs.head_sha }}
          push-main: ${{ inputs.target_branch == 'main' }}
          build-args: NPM_REGISTRY=https://registry.npmjs.org/
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          registry-username: ${{ secrets.ALI_DOCKER_USERNAME }}
          registry-password: ${{ secrets.ALI_DOCKER_PASSWORD }}

  deploy:
    name: Deploy
    needs: build
    if: ${{ inputs.event_name == 'push' && inputs.target_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A deployment in progress is never cancelled; the one waiting behind it is replaced by a newer one.
    concurrency:
      group: pro-registry-deploy
      cancel-in-progress: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Deploy
        uses: ./.github/nocobase3/ssh-deploy
        with:
          name: pkg-v3
          tag: ${{ needs.build.outputs.tag }}
          ssh-key: ${{ secrets.PRO_REGISTRY_DEPLOY_SSH_KEY }}
          deploy-host: ${{ vars.PRO_REGISTRY_DEPLOY_HOST }}
          known-hosts: ${{ vars.PRO_REGISTRY_DEPLOY_KNOWN_HOSTS }}
          secret-names: PRO_REGISTRY_DEPLOY_SSH_KEY, PRO_REGISTRY_DEPLOY_HOST or PRO_REGISTRY_DEPLOY_KNOWN_HOSTS
