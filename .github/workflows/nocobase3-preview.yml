name: NocoBase 3 preview
run-name: nocobase3-preview:${{ inputs.request_id }}

# NocoBase 3 pull requests in nocobase/nocobase, dispatched by nocobase-bot (docs/ci-forwarding.md there), whose
# direct target is v3-develop, v3-main or a single-level <type>/v3-<name> stacked branch. The bot mirrors the jobs below
# as check runs of the same names on nocobase/nocobase; the job names are that protocol. It forwards only pull requests
# from branches of the repository itself, never from forks: the previews run the pull request's code next to the Studio key.
#
# - `Preview`: the examples template, deployed to `nocobase-v3-pr-<n>`, for `agent/PM-<n>` branches only.
# - `Studio preview`, `Studio e2e`, `CLI reference` and `Studio dist`: NocoBase Studio (packages/apps/studio), when the
#   pull request changes Studio or what it is built from (`Scope` decides). The preview deploys to
#   `nocobase-v3-studio-pr-<n>`; the e2e job uploads screenshots and traces only on failure, kept for three days; the
#   dist job keeps the `nb-studio` and `nocobase-runner` tarballs as artifacts for three days.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository under nocobase; only nocobase, whose v3 branches are previewed.
        type: choice
        options:
          - nocobase
        default: nocobase
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the no-preview label (true or false).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nocobase-v3-preview-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # Studio's standard preview workflow, adapted to a run that is neither in nocobase/nocobase nor started by its
  # pull_request event: every command names the repository and the commit itself, and the logs are this run's. The key
  # is given only to the steps that call Studio, through NB_STUDIO_API_KEY rather than a stored login.
  preview:
    name: Preview
    if: ${{ inputs.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NB_STUDIO_SERVER: ${{ vars.NB_STUDIO_URL }}
      REPOSITORY: nocobase/nocobase
      HEAD_SHA: ${{ inputs.head_sha }}
      APP_ID: nocobase-v3-pr-${{ inputs.pr_number }}
      ENVIRONMENT: preview
      TEMPLATE: packages/templates/app-template-examples
      LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      # The pull request's head itself, not a merge: Studio verifies the commit it deploys is the pull request's head.
      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase
          path: nocobase3
          partial-history: 'true'
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      # A pull request that carries the `no-preview` label, or changes nothing the examples application runs (only
      # documentation, tests, changesets, Skills, Studio or CI files), gets no preview: the job ends here and Studio is
      # told nothing. The bot passes the label as skip_label; the labels are read again in case it changed since.
      - name: Read the pull request's labels
        id: pr-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase
          permission-pull-requests: read

      - name: Decide whether to preview
        id: gate
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          SKIP_LABEL: ${{ inputs.skip_label }}
        run: |
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Preview skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview skipped: $1"
          }
          if [ "$SKIP_LABEL" = 'true' ] || gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx 'no-preview'; then
            skip "The pull request has the \`no-preview\` label."
            exit 0
          fi
          head_ref=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)
          if ! printf '%s' "$head_ref" | grep -qE '^agent/PM-[0-9]+$'; then
            skip "Only \`agent/PM-<n>\` branches get an examples preview; this one is \`$head_ref\`."
            exit 0
          fi
          base=$(git -C nocobase3 merge-base "$BASE_SHA" "$HEAD_SHA")
          runtime=$(git -C nocobase3 diff --name-only "$base" "$HEAD_SHA" | grep -viE '^(docs/|packages/apps/|skills/|\.changeset/|\.github/)|(^|/)(tests|e2e)/|\.test\.tsx?$|\.md$' || true)
          if [ -z "$runtime" ]; then
            skip 'It changes only documentation, tests, changesets, Skills, Studio or CI files.'
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install the nb-studio CLI
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: |
          eval "$(curl -fsS -H "x-api-key: $NB_STUDIO_API_KEY" "$NB_STUDIO_SERVER/api/agents/dist/products/nb-studio/targets/linux-x64?format=env")"
          mkdir -p "$RUNNER_TEMP/nb-studio"
          curl -fsS -H "x-api-key: $NB_STUDIO_API_KEY" "$NB_STUDIO_SERVER$url" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/nb-studio"
          echo "$RUNNER_TEMP/nb-studio/bin" >> "$GITHUB_PATH"
          # A command the CLI derives from the server's manifest (app ensure, deploy) fetches that manifest with the
          # stored sign-in, not with NB_STUDIO_API_KEY, so the CLI signs in with the key as Studio's generated workflow does.
          printf %s "$NB_STUDIO_API_KEY" | NB_STUDIO_KEYCHAIN=off "$RUNNER_TEMP/nb-studio/bin/nb-studio" login --server "$NB_STUDIO_SERVER" --api-key-stdin

      - name: Report the build
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio build status --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --state building --logs "$LOGS"

      # The pnpm version is the repository's own `packageManager`.
      - name: Set up pnpm
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nocobase3/package.json
          run_install: false

      - name: Set up Node.js
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: nocobase3
        run: pnpm install --frozen-lockfile

      # Builds the workspace packages the template depends on, then its client and server into dist/, with the
      # workspace packages vendored into dist/vendor. Leaves storage/exports/dist.tar.gz: dist/ and config.example.yml.
      - name: Build the deployment archive
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: nocobase3/${{ env.TEMPLATE }}
        run: pnpm build --target linux-x64 --tar

      # The pull request's own App: Studio records the pull request as its source and removes it once it goes.
      - name: Ensure the pull request's App
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio app ensure "$APP_ID" --environment "$ENVIRONMENT" --repository "$REPOSITORY"

      # Uploads the archive and deploys it; a protected environment asks its approvers instead.
      - name: Deploy
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio deploy --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --file "nocobase3/$TEMPLATE/storage/exports/dist.tar.gz"

      - name: Report the failure
        if: ${{ failure() && steps.gate.outputs.skip == 'false' }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio build status --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --state failed --logs "$LOGS"

  # Decides which Studio jobs run: a pull request that changes Studio, a package Studio is built from directly, or the
  # dependency graph. Everything else in the repository is covered by its own CI, and the Studio jobs are skipped.
  scope:
    name: Scope
    if: ${{ inputs.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      studio: ${{ steps.scope.outputs.studio }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase
          path: nocobase3
          partial-history: 'true'
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Read the pull request's labels
        id: pr-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase
          permission-pull-requests: read

      - name: Decide what runs
        id: scope
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          REPOSITORY: nocobase/nocobase
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SKIP_LABEL: ${{ inputs.skip_label }}
          STUDIO_PATHS: '^(packages/apps/studio/|packages/app/(app-server|app-client|app-cli|app-cli-client|agent-runner)/|packages/libs/agent-protocol/|packages/plugins/app-plugin-(projects|agents|knowledge|releases)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
        run: |
          base=$(git -C nocobase3 merge-base "$BASE_SHA" "$HEAD_SHA")
          studio=false
          if git -C nocobase3 diff --name-only "$base" "$HEAD_SHA" | grep -qE "$STUDIO_PATHS"; then
            studio=true
          fi
          preview=$studio
          if [ "$SKIP_LABEL" = 'true' ] || gh api "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx 'no-preview'; then
            preview=false
          fi
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          {
            echo '### Scope'
            echo "- Studio jobs: $studio"
            echo "- Studio preview: $preview"
          } >> "$GITHUB_STEP_SUMMARY"

  # Studio built from the pull request's own packages/apps/studio and deployed to its own App
  # `nocobase-v3-studio-pr-<n>`, as Studio's standard preview workflow does, adapted to a run that is neither in
  # nocobase/nocobase nor started by its pull_request event. The key is given only to the steps that call Studio.
  studio-preview:
    name: Studio preview
    needs: scope
    if: ${{ needs.scope.outputs.preview == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NB_STUDIO_SERVER: ${{ vars.NB_STUDIO_URL }}
      REPOSITORY: nocobase/nocobase
      HEAD_SHA: ${{ inputs.head_sha }}
      APP_ID: nocobase-v3-studio-pr-${{ inputs.pr_number }}
      ENVIRONMENT: preview
      LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase
          path: nocobase3
          partial-history: 'false'
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Install the nb-studio CLI
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: |
          eval "$(curl -fsS -H "x-api-key: $NB_STUDIO_API_KEY" "$NB_STUDIO_SERVER/api/agents/dist/products/nb-studio/targets/linux-x64?format=env")"
          mkdir -p "$RUNNER_TEMP/nb-studio"
          curl -fsS -H "x-api-key: $NB_STUDIO_API_KEY" "$NB_STUDIO_SERVER$url" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/nb-studio"
          echo "$RUNNER_TEMP/nb-studio/bin" >> "$GITHUB_PATH"
          printf %s "$NB_STUDIO_API_KEY" | NB_STUDIO_KEYCHAIN=off "$RUNNER_TEMP/nb-studio/bin/nb-studio" login --server "$NB_STUDIO_SERVER" --api-key-stdin

      - name: Report the build
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio build status --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --state building --logs "$LOGS"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nocobase3/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        working-directory: nocobase3
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      - name: Build the workspace packages Studio depends on
        working-directory: nocobase3
        run: pnpm --filter "@nocobase/studio^..." build

      # Leaves storage/exports/dist.tar.gz: dist/ and config.example.yml.
      - name: Build the deployment archive
        working-directory: nocobase3/packages/apps/studio
        env:
          NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD: '1'
        run: pnpm build --target linux-x64 --tar

      - name: Ensure the pull request's App
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio app ensure "$APP_ID" --environment "$ENVIRONMENT" --repository "$REPOSITORY"

      - name: Deploy
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio deploy --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --file nocobase3/packages/apps/studio/storage/exports/dist.tar.gz

      - name: Report the failure
        if: ${{ failure() }}
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY_NOCOBASE_V3 }}
        run: nb-studio build status --app "$APP_ID" --repository "$REPOSITORY" --sha "$HEAD_SHA" --state failed --logs "$LOGS"

  # Studio's browser tests (`docs/e2e.md` in packages/apps/studio) against a built Studio with its demo data. Public
  # repository: what the pages showed is uploaded only to look into a failure, and kept briefly.
  studio-e2e:
    name: Studio e2e
    needs: scope
    if: ${{ needs.scope.outputs.studio == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase
          path: nocobase3
          partial-history: 'false'
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nocobase3/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        working-directory: nocobase3
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      - name: Build the workspace packages Studio depends on
        working-directory: nocobase3
        run: pnpm --filter "@nocobase/studio^..." build

      - name: Build Studio
        working-directory: nocobase3/packages/apps/studio
        env:
          NOCOBASE_SKIP_WORKSPACE_DEPENDENCY_BUILD: '1'
        run: pnpm build

      - name: Install Chromium
        working-directory: nocobase3/packages/apps/studio
        run: pnpm exec playwright install --with-deps chromium

      - name: Flows
        working-directory: nocobase3/packages/apps/studio
        run: pnpm test:e2e

      - name: Screenshots
        if: ${{ !cancelled() }}
        working-directory: nocobase3/packages/apps/studio
        run: pnpm test:screenshots

      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-screenshots
          path: nocobase3/packages/apps/studio/output/screenshots
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload failed test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-results
          path: nocobase3/packages/apps/studio/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The nb-studio command reference (packages/apps/studio/docs/cli/reference) is generated from the API document; this
  # fails when the committed reference is not what the sources would write.
  cli-reference:
    name: CLI reference
    needs: scope
    if: ${{ needs.scope.outputs.studio == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase
          path: nocobase3
          partial-history: 'false'
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nocobase3/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        working-directory: nocobase3
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      - name: Build the workspace packages Studio depends on
        working-directory: nocobase3
        run: pnpm --filter "@nocobase/studio^..." build

      - name: CLI reference
        working-directory: nocobase3/packages/apps/studio
        run: pnpm cli-reference:check

  # Builds the `nb-studio` and `nocobase-runner` tarballs as a check, and keeps them as short-lived artifacts.
  studio-dist:
    name: Studio dist
    needs: scope
    if: ${{ needs.scope.outputs.studio == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Studio's build typechecks it together with the framework's sources, which needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          repository: nocobase
          path: nocobase3
          partial-history: 'false'
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nocobase3/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Studio and the workspace packages it depends on, nothing else in the repository.
      - name: Install dependencies
        working-directory: nocobase3
        run: pnpm install --frozen-lockfile --filter "@nocobase/studio..."

      - name: Build the workspace packages Studio depends on
        working-directory: nocobase3
        run: pnpm --filter "@nocobase/studio^..." build

      - name: Build the nb-studio tarballs
        working-directory: nocobase3/packages/apps/studio
        run: pnpm nocobase cli build --out output/dist

      - name: Build the nocobase-runner tarballs
        working-directory: nocobase3/packages/apps/studio
        run: pnpm nocobase cli build --runner --out output/dist

      - name: Upload the nb-studio tarballs
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist-nb-studio
