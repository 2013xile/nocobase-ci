name: NocoBase 3 Pro CI
run-name: pro-ci:${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID shared with the source-repository check runs.
        required: true
        type: string
      event_name:
        description: Source event type (pull_request or push).
        required: true
        type: string
      head_sha:
        description: Immutable 40-character source head SHA.
        required: true
        type: string
      base_sha:
        description: Immutable 40-character base SHA, or forty zeroes for the first push.
        required: true
        type: string
      target_branch:
        description: Source target branch.
        required: true
        type: string
      pr_number:
        description: Positive pull request number, or 0 for a push.
        required: true
        type: string
      skip_label:
        description: Whether the source pull request has the release:skip label (true or false).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nocobase3-pro-ci-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  submodule:
    name: Submodule and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the submodule pointer tracks the target branch
        working-directory: pro
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: node "$GITHUB_WORKSPACE/.github/nocobase3/check-framework-pointer.mjs"

      - name: Verify the catalog mirrors the submodule
        working-directory: pro
        run: node ./scripts/sync-workspace-config.mjs --check

  changed-files:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: pro
        run: pnpm install --frozen-lockfile

      - name: Build shared development config
        working-directory: pro
        run: pnpm dev-config:build

      - name: Check changed files
        shell: bash
        working-directory: pro
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          root_files=()
          prettier_files=()

          while IFS= read -r -d '' file; do
            case "$file" in
              packages/*|vendor/*) ;;
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts) root_files+=("$file") ;;
            esac

            case "$file" in
              vendor/*) ;;
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.mts|*.cts|*.json|*.json5|*.jsonc|*.md|*.mdx|*.yml|*.yaml|*.css|*.scss|*.less|*.html)
                prettier_files+=("$file")
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")

          if ((${#root_files[@]})); then
            pnpm exec eslint --no-warn-ignored --max-warnings 0 -- "${root_files[@]}"
          fi

          pnpm --filter "[$BASE_SHA]" --if-present lint

          if ((${#prettier_files[@]})); then
            pnpm exec prettier --check --ignore-path .prettierignore -- "${prettier_files[@]}"
          fi

  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            script: typecheck
            pack_check: false
            peers_check: true
            openapi_check: true
          - name: Test
            script: test
            pack_check: false
            peers_check: false
            openapi_check: false
          - name: Build
            script: build
            pack_check: true
            peers_check: false
            openapi_check: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: pro
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        if: ${{ matrix.peers_check }}
        working-directory: pro
        run: pnpm peers:check

      # Starts the OSS Default application with the Pro plugins on SQLite test databases and fails on an /api route
      # that declares nothing, an operation without tags, summary or operationId, a duplicate operationId, or a schema
      # reference the API document cannot resolve. It runs from TypeScript sources and needs no build.
      - name: Check API document declarations
        if: ${{ matrix.openapi_check }}
        working-directory: pro
        run: pnpm openapi:check

      - name: ${{ matrix.name }}
        working-directory: pro
        run: pnpm ${{ matrix.script }}

      - name: Check package tarballs
        if: ${{ matrix.pack_check }}
        working-directory: pro
        env:
          PACK_DIR: ${{ runner.temp }}/nocobase-pack-check
        run: pnpm pack:check

  create-app-smoke:
    name: Pro plugins on OSS Default installation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: pro
        run: pnpm install --frozen-lockfile

      - name: Verify Pro plugins with current OSS Default source
        uses: ./.github/nocobase3/verify-create-app

  # The commercial database drivers' integration suites each start their database in Docker Compose and take several
  # minutes, so they run in their own parallel jobs, and on a pull request only when its changes may affect them: a
  # driver package, the vendor/nocobase3 pointer that carries the shared contracts, or the root dependency manifests.
  # Pushes always run them.
  pro-db-plan:
    name: Select Pro DB integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Select by changed files
        id: select
        shell: bash
        working-directory: pro
        env:
          EVENT_NAME: ${{ inputs.event_name }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          should_run=false
          reason=''
          matched=()

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            should_run=true
            reason="A $EVENT_NAME always runs the integration suites."
          elif [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            should_run=true
            reason='The base commit is unavailable, so every suite runs.'
          elif ! git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/pro-db-changed-files"; then
            should_run=true
            reason='The changed files could not be listed, so every suite runs.'
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                packages/libs/db-*|vendor/nocobase3|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|.pnpmfile.cjs)
                  matched+=("$file")
                  ;;
              esac
            done < "$RUNNER_TEMP/pro-db-changed-files"

            if ((${#matched[@]})); then
              should_run=true
              reason="${#matched[@]} changed file(s) may affect the database drivers."
            else
              reason='No change touches a database driver, the vendor/nocobase3 pointer, or the root dependency manifests.'
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Pro DB integration: should_run=$should_run. $reason"
          {
            echo '### Pro DB integration'
            echo
            echo "Run the integration suites: \`$should_run\`. $reason"
            if ((${#matched[@]})); then
              echo
              for file in "${matched[@]:0:20}"; do
                echo "- \`$file\`"
              done
              if ((${#matched[@]} > 20)); then
                echo "- and $((${#matched[@]} - 20)) more"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pro-db-integration:
    name: Pro DB integration (${{ matrix.database }})
    needs: pro-db-plan
    if: ${{ needs.pro-db-plan.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database:
          - kingbase
          - dameng
          - oceanbase
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: pro
        run: pnpm install --frozen-lockfile

      - name: Build shared development config
        working-directory: pro
        run: pnpm dev-config:build

      - name: Run the ${{ matrix.database }} integration suite
        working-directory: pro
        run: pnpm --filter @nocobase/db-${{ matrix.database }} test:integration

  pro-db-integration-summary:
    name: Pro DB integration
    if: ${{ always() }}
    needs:
      - pro-db-plan
      - pro-db-integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify the integration suites
        env:
          PLAN_RESULT: ${{ needs.pro-db-plan.result }}
          SHOULD_RUN: ${{ needs.pro-db-plan.outputs.should_run }}
          INTEGRATION_RESULT: ${{ needs.pro-db-integration.result }}
        run: |
          if [[ "$PLAN_RESULT" != 'success' ]]; then
            echo "Selecting the Pro DB integration suites did not succeed ($PLAN_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == 'false' && "$INTEGRATION_RESULT" == 'skipped' ]]; then
            echo 'No change may affect the database drivers, so the integration suites were skipped.'
            exit 0
          fi
          if [[ "$INTEGRATION_RESULT" != 'success' ]]; then
            echo "One or more Pro DB integration suites failed or were cancelled ($INTEGRATION_RESULT)."
            exit 1
          fi
          echo 'Every Pro DB integration suite passed.'

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - submodule
      - changed-files
      - validation
      - create-app-smoke
      - pro-db-integration-summary
    runs-on: ubuntu-latest
    steps:
      - name: Verify parallel jobs
        env:
          SUBMODULE_RESULT: ${{ needs.submodule.result }}
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          SMOKE_RESULT: ${{ needs.create-app-smoke.result }}
          PRO_DB_RESULT: ${{ needs.pro-db-integration-summary.result }}
        run: |
          if [[ "$SUBMODULE_RESULT" != 'success' || "$CHANGED_FILES_RESULT" != 'success' || "$VALIDATION_RESULT" != 'success' || "$SMOKE_RESULT" != 'success' || "$PRO_DB_RESULT" != 'success' ]]; then
            echo 'One or more quality jobs failed or were cancelled.'
            exit 1
          fi

  changeset-check:
    name: Validate and advise
    if: ${{ inputs.event_name == 'pull_request' && (inputs.target_branch == 'main' || inputs.target_branch == 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed pull request head
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}
          merge-pull-request: 'false'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: pro
        run: pnpm install --frozen-lockfile

      - name: Validate changeset files
        working-directory: pro
        run: node ./vendor/nocobase3/scripts/validate-changesets.mjs

      - name: Require a changeset for every changed package
        working-directory: pro
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SKIP_LABEL: ${{ inputs.skip_label }}
        run: node ./vendor/nocobase3/scripts/require-changesets.mjs

  guard-main:
    name: Reject prerelease state
    if: ${{ inputs.event_name == 'pull_request' && inputs.target_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Check out fixed source snapshot
        uses: ./.github/nocobase3/checkout
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          request-id: ${{ inputs.request_id }}
          event-name: ${{ inputs.event_name }}
          head-sha: ${{ inputs.head_sha }}
          base-sha: ${{ inputs.base_sha }}
          target-branch: ${{ inputs.target_branch }}
          pr-number: ${{ inputs.pr_number }}
          skip-label: ${{ inputs.skip_label }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check for prerelease state files
        working-directory: pro
        run: |
          FOUND=''
          [ -f .changeset/pre.json ] && FOUND="$FOUND .changeset/pre.json"
          if [ -d .changeset/pre ] && [ -n "$(ls -A .changeset/pre 2>/dev/null)" ]; then
            FOUND="$FOUND .changeset/pre/"
          fi
          if [ -n "$FOUND" ]; then
            echo "::error::Prerelease state files are not allowed on main: $FOUND"
            echo 'If this is a promotion merge, changeset version either did not run or the merge happened before it did.'
            exit 1
          fi
          echo 'No prerelease state files found'

      - name: Check the submodule tracks the stable line
        working-directory: pro
        env:
          TARGET_BRANCH: main
        run: node "$GITHUB_WORKSPACE/.github/nocobase3/check-framework-pointer.mjs"

      - name: Check for prerelease versions
        working-directory: pro
        run: |
          LEFT=$(node ./vendor/nocobase3/scripts/list-package-versions.mjs --prerelease)
          if [ -n "$LEFT" ]; then
            echo "::error::Prerelease versions are not allowed on main: $LEFT"
            exit 1
          fi
          echo 'No prerelease versions found'
