name: Bot image
run-name: bot-image:${{ inputs.ref }}

# A manual build of nocobase-bot's image from the private nocobase/nocobase-bot repository, from any branch, tag or commit, pushed to the internal registry as linux/amd64: `sha-<short sha>` always, plus the moving tag `main` when `ref` is `main`. A build of any other ref never moves `main`, so a hand-built old commit cannot replace what is deployed. It builds exactly as the forwarded CI does (the composite action image-push).
#
# Pushes to `main` are built and deployed by bot-ci.yml, which nocobase-bot forwards with the checks `Build` and `Deploy`; nothing dispatches this workflow any more. A build of `main` here is deployed too, by the `deploy` job, in the group `bot-deploy` it shares with bot-ci.yml, so the two never deploy at the same time. See "Image deployments over SSH" in .github/nocobase3/README.md. Run it by hand, with `-f deploy=false` to build `main` without deploying it; any other ref is never deployed:
#
#   gh workflow run bot-image.yml -R 2013xile/nocobase-ci -f ref=main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of nocobase/nocobase-bot to build.
        required: true
        default: main
        type: string
      deploy:
        description: Deploy the image to noco-bot once it is built; only a build of `main` is ever deployed.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  image:
    name: Build the linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer build of the same ref replaces this one; the deployment has its own group and is never cancelled.
    concurrency:
      group: bot-image-${{ inputs.ref }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      # A read-only token for nocobase/nocobase-bot alone, revoked as soon as the source is checked out.
      - name: Create a read-only source token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOCOBASE_APP_ID }}
          private-key: ${{ secrets.NOCOBASE_APP_PRIVATE_KEY }}
          owner: nocobase
          repositories: nocobase-bot
          permission-contents: read
          skip-token-revoke: true

      # Resolves the ref once, so the checkout and the tag name the same commit even if the branch moves meanwhile.
      - name: Resolve the ref
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          commit=$(gh api "repos/nocobase/nocobase-bot/commits/${REF}" --jq .sha)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "sha=${commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check out nocobase-bot
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase-bot
          ref: ${{ steps.resolve.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: nocobase-bot
          persist-credentials: false
          show-progress: false

      - name: Revoke the source token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $APP_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/installation/token

      - name: Build and push the image
        uses: ./.github/nocobase3/image-push
        with:
          path: nocobase-bot
          image: nocobase/nocobase-bot
          sha: ${{ steps.resolve.outputs.commit }}
          moving-tag: ${{ inputs.ref == 'main' && 'main' || '' }}
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          registry-username: ${{ secrets.ALI_DOCKER_USERNAME }}
          registry-password: ${{ secrets.ALI_DOCKER_PASSWORD }}

  deploy:
    name: Deploy to noco-bot
    needs: image
    if: ${{ inputs.ref == 'main' && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A deployment in progress is never cancelled; the one waiting behind it is replaced by a newer one.
    concurrency:
      group: bot-deploy
      cancel-in-progress: false
    steps:
      - name: Check out trusted CI helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/nocobase3

      - name: Deploy
        uses: ./.github/nocobase3/ssh-deploy
        with:
          name: nocobase-bot
          tag: sha-${{ needs.image.outputs.sha }}
          ssh-key: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
          deploy-host: ${{ vars.BOT_DEPLOY_HOST }}
          known-hosts: ${{ vars.BOT_DEPLOY_KNOWN_HOSTS }}
          secret-names: BOT_DEPLOY_SSH_KEY, BOT_DEPLOY_HOST or BOT_DEPLOY_KNOWN_HOSTS
